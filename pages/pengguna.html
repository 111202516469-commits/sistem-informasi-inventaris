<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengguna - InventarisKu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>⬡ InventarisKu</h2>
        <nav>
            <a href="dashboard.html">⌂ Dashboard</a>
            <a href="kategori.html">▤ Kategori Barang</a>
            <a href="barang.html">▣ Data Barang</a>
            <a href="peminjaman.html">◷ Peminjaman</a>
            <a href="pengguna.html" class="active">♙ Pengguna</a>
            <a href="login.html" class="logout">⇥ Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button type="button" id="menuToggle">☰</button>
            <span>Admin</span>
        </header>

        <section class="content">
            <div class="welcome">
                <h1>Data Pengguna</h1>
                <p>Kelola daftar pengguna sistem inventaris.</p>
                <p id="tanggalWaktu"></p>
            </div>

            <section class="panel">
                <h2>Tambah Pengguna</h2>
                <form id="formPengguna">
                    <div class="form-group">
                        <label for="nama">Nama Pengguna</label>
                        <input id="nama" required placeholder="Masukkan nama">
                    </div>
                    <div class="form-group">
                        <label for="peran">Peran</label>
                        <select id="peran" required>
                            <option value="">Pilih peran</option>
                            <option>Admin</option>
                            <option>Petugas</option>
                            <option>Peminjam</option>
                        </select>
                    </div>
                    <button type="submit" class="button">+ Tambah Pengguna</button>
                    <button type="reset" class="button">Kosongkan</button>
                    <p id="pesan"></p>
                </form>
            </section>

            <section class="panel">
                <h2>Daftar Pengguna</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Nama Pengguna</th>
                                <th>Peran</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="daftarPengguna"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>

<script src="../assets/js/script.js"></script>
<script>
const kunci = "inventarisku_pengguna";
let pengguna = JSON.parse(localStorage.getItem(kunci) || "null") || [
    {nama:"Administrator", peran:"Admin"},
    {nama:"Petugas Inventaris", peran:"Petugas"}
];

const form = document.getElementById("formPengguna");
const daftar = document.getElementById("daftarPengguna");
const pesan = document.getElementById("pesan");

function simpan() {
    localStorage.setItem(kunci, JSON.stringify(pengguna));
}

function tampilkan() {
    daftar.replaceChildren();

    pengguna.forEach((item, index) => {
        const baris = document.createElement("tr");

        [index + 1, item.nama, item.peran].forEach(nilai => {
            const sel = document.createElement("td");
            sel.textContent = nilai;
            baris.appendChild(sel);
        });

        const kolomAksi = document.createElement("td");
        const tombol = document.createElement("button");
        tombol.type = "button";
        tombol.className = "button";
        tombol.textContent = "Hapus";

        tombol.onclick = () => {
            if (confirm("Hapus pengguna " + item.nama + "?")) {
                pengguna.splice(index, 1);
                simpan();
                tampilkan();
                pesan.textContent = "Pengguna berhasil dihapus.";
            }
        };

        kolomAksi.appendChild(tombol);
        baris.appendChild(kolomAksi);
        daftar.appendChild(baris);
    });
}

form.addEventListener("submit", event => {
    event.preventDefault();

    const nama = document.getElementById("nama").value.trim();
    const peran = document.getElementById("peran").value;

    if (!nama || !peran) {
        pesan.textContent = "Semua kolom wajib diisi.";
        return;
    }

    pengguna.push({nama, peran});
    simpan();
    tampilkan();
    form.reset();
    pesan.textContent = "Pengguna berhasil ditambahkan.";
});

tampilkan();
</script>
</body>
</html>
