<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Barang - InventarisKu</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/theme.css">

    <style>
        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            padding: 25px 16px;
        }

        .sidebar h2 {
            color: white;
            margin: 0 0 28px;
        }

        .sidebar a {
            display: block;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 9px;
            color: white;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background: #2563eb;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 32px;
        }

        .form-card {
            max-width: 760px;
            margin-top: 24px;
            padding: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
        }

        @media (max-width: 700px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                padding: 16px;
            }

            .sidebar h2 {
                margin-bottom: 12px;
            }

            .main {
                padding: 18px;
            }

            .form-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<div class="layout">

    <aside class="sidebar">
        <h2>📦 InventarisKu</h2>

        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="kategori.html">📁 Kategori Barang</a>
        <a href="barang.html" class="active">📦 Data Barang</a>
        <a href="peminjaman.html">🔄 Peminjaman</a>
        <a href="pengguna.html">👥 Pengguna</a>
        <a href="login.html">🚪 Keluar</a>
    </aside>

    <main class="main">
        <a class="back-link" href="barang.html">← Kembali ke Data Barang</a>

        <h1>Form Tambah Barang</h1>
        <p>Isi informasi barang yang ingin ditambahkan ke inventaris.</p>

        <section class="form-card">
            <form id="formBarang">
                <div class="form-group">
                    <label for="kode">Kode Barang</label>
                    <input type="text" id="kode" required
                           placeholder="Contoh: BRG006">
                </div>

                <div class="form-group">
                    <label for="nama">Nama Barang</label>
                    <input type="text" id="nama" required
                           placeholder="Masukkan nama barang">
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori Barang</label>
                    <input type="text" id="kategori" required
                           placeholder="Contoh: Elektronik">
                </div>

                <div class="form-group">
                    <label for="jumlah">Jumlah Barang</label>
                    <input type="number" id="jumlah" required
                           min="1" step="1" placeholder="Masukkan jumlah">
                </div>

                <div class="form-group">
                    <label for="lokasi">Lokasi Penyimpanan</label>
                    <input type="text" id="lokasi"
                           placeholder="Contoh: Ruang Laboratorium">
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan</label>
                    <textarea id="keterangan"
                              placeholder="Keterangan tambahan (opsional)"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit">💾 Simpan Barang</button>
                    <a class="btn btn-secondary" href="barang.html">
                        Batal
                    </a>
                </div>

                <p id="pesan" role="status"></p>
            </form>
        </section>
    </main>

</div>

<script>
document.getElementById("formBarang").addEventListener("submit", function(event) {
    event.preventDefault();

    const kode = document.getElementById("kode").value.trim();
    const nama = document.getElementById("nama").value.trim();
    const kategori = document.getElementById("kategori").value.trim();
    const jumlah = Number(document.getElementById("jumlah").value);
    const lokasi = document.getElementById("lokasi").value.trim();
    const keterangan = document.getElementById("keterangan").value.trim();
    const pesan = document.getElementById("pesan");

    if (!Number.isInteger(jumlah) || jumlah < 1) {
        pesan.style.color = "#dc2626";
        pesan.textContent = "Jumlah barang harus berupa bilangan bulat minimal 1.";
        return;
    }

    let daftarBarang = [];

    try {
        daftarBarang = JSON.parse(
            localStorage.getItem("inventarisku_barang") || "[]"
        );

        if (!Array.isArray(daftarBarang)) {
            daftarBarang = [];
        }
    } catch (error) {
        pesan.style.color = "#dc2626";
        pesan.textContent = "Data barang tidak dapat dibaca. Periksa penyimpanan browser.";
        return;
    }

    const kodeSudahAda = daftarBarang.some(
        barang => String(barang.kode || "").toLowerCase() === kode.toLowerCase()
    );

    if (kodeSudahAda) {
        pesan.style.color = "#dc2626";
        pesan.textContent = "Kode barang sudah digunakan. Gunakan kode lain.";
        return;
    }

    daftarBarang.push({
        kode: kode,
        nama: nama,
        kategori: kategori,
        jumlah: jumlah,
        lokasi: lokasi,
        keterangan: keterangan
    });

    try {
        localStorage.setItem(
            "inventarisku_barang",
            JSON.stringify(daftarBarang)
        );
    } catch (error) {
        pesan.style.color = "#dc2626";
        pesan.textContent = "Gagal menyimpan data di browser.";
        return;
    }

    window.location.href = "barang.html";
});
</script>
</body>
</html>
