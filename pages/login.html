<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InventarisKu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f7faff);
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(25, 60, 110, 0.12);
            box-sizing: border-box;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #2878e8;
            color: white;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #20324a;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34445b;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5deeb;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: 2px solid #b6d2ff;
            border-color: #2878e8;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #2878e8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1763cc;
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #c0392b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2878e8;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card">
            <div class="logo">⬡</div>

            <h1>InventarisKu</h1>
            <p class="subtitle">Silakan masuk ke sistem inventaris</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="login-button">
                    Masuk
                </button>

                <p id="pesanLogin" class="message" role="status"></p>
            </form>

            <a class="back-link" href="../index.html">
                ← Kembali ke halaman utama
            </a>
        </section>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const pesan = document.getElementById("pesanLogin");

            if (!username || !password.trim()) {
                pesan.textContent = "Username dan password wajib diisi.";
                return;
            }

           if (username === "admin" && password === "admin123") {
    window.location.href = "dashboard.html";
    } else {
    pesan.style.color = "#dc2626";
    pesan.textContent = "Username atau password salah!";
    }
    });
</script>
</body>
</html>
