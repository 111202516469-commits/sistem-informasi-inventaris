<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategori Barang - InventarisKu</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>⬡ InventarisKu</h2>
            <nav>
                <a href="dashboard.html">⌂ Dashboard</a>
                <a href="kategori.html" class="active">▤ Kategori Barang</a>
                <a href="barang.html">▣ Data Barang</a>
                <a href="peminjaman.html">◷ Peminjaman</a>
                <a href="pengguna.html">♙ Pengguna</a>
                <a href="login.html" class="logout">⇥ Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button type="button" id="menuToggle">☰</button>
                <span>Admin</span>
            </header>

            <section class="content">
                <div class="welcome">
                    <h1>Kategori Barang</h1>
                    <p>Kelola kategori untuk mengelompokkan barang inventaris.</p>
                    <p id="tanggalWaktu"></p>
                </div>

                <section class="panel">
                    <h2>Tambah Kategori</h2>
                    <form id="formKategori">
                        <div class="form-group">
                            <label for="namaKategori">Nama Kategori</label>
                            <input type="text" id="namaKategori"
                                placeholder="Contoh: Elektronik" required>
                        </div>
                        <button type="submit" class="button">+ Tambah Kategori</button>
                        <button type="reset" class="button">Kosongkan</button>
                        <p id="pesanKategori"></p>
                    </form>
                </section>

                <section class="panel">
                    <h2>Daftar Kategori</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>No.</th>
                                    <th>Nama Kategori</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="daftarKategori"></tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="../assets/js/script.js"></script>
    <script>
        const kunciKategori = "inventarisku_kategori";
        let kategori = JSON.parse(localStorage.getItem(kunciKategori) || "null")
            || ["Elektronik", "Furniture", "Aksesoris", "Alat Tulis"];
        let indeksEdit = -1;

        const form = document.getElementById("formKategori");
        const input = document.getElementById("namaKategori");
        const daftar = document.getElementById("daftarKategori");
        const pesan = document.getElementById("pesanKategori");
        const tombolSimpan = form.querySelector('button[type="submit"]');

        function simpanKategori() {
            localStorage.setItem(kunciKategori, JSON.stringify(kategori));
        }

        function tampilkanKategori() {
            daftar.replaceChildren();

            kategori.forEach((nama, indeks) => {
                const baris = document.createElement("tr");
                const nomor = document.createElement("td");
                const kolomNama = document.createElement("td");
                const kolomAksi = document.createElement("td");
                const tombolEdit = document.createElement("button");
                const tombolHapus = document.createElement("button");

                nomor.textContent = indeks + 1;
                kolomNama.textContent = nama;

                tombolEdit.textContent = "Edit";
                tombolEdit.type = "button";
                tombolEdit.className = "button";
                tombolEdit.onclick = () => {
                    indeksEdit = indeks;
                    input.value = kategori[indeks];
                    tombolSimpan.textContent = "Simpan Perubahan";
                    pesan.textContent = "Ubah nama kategori, lalu simpan.";
                    input.focus();
                };

                tombolHapus.textContent = "Hapus";
                tombolHapus.type = "button";
                tombolHapus.className = "button";
                tombolHapus.onclick = () => {
                    if (confirm("Hapus kategori " + nama + "?")) {
                        kategori.splice(indeks, 1);
                        simpanKategori();
                        tampilkanKategori();
                        pesan.textContent = "Kategori berhasil dihapus.";
                    }
                };

                kolomAksi.append(tombolEdit, document.createTextNode(" "), tombolHapus);
                baris.append(nomor, kolomNama, kolomAksi);
                daftar.appendChild(baris);
            });
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            const nama = input.value.trim();

            if (!nama) {
                pesan.textContent = "Nama kategori wajib diisi.";
                return;
            }

            const sudahAda = kategori.some((item, indeks) =>
                item.toLowerCase() === nama.toLowerCase() &&
                indeks !== indeksEdit
            );

            if (sudahAda) {
                pesan.textContent = "Kategori tersebut sudah ada.";
                return;
            }

            if (indeksEdit >= 0) {
                kategori[indeksEdit] = nama;
                pesan.textContent = "Kategori berhasil diperbarui.";
            } else {
                kategori.push(nama);
                pesan.textContent = "Kategori berhasil ditambahkan.";
            }

            indeksEdit = -1;
            simpanKategori();
            tampilkanKategori();
            form.reset();
            tombolSimpan.textContent = "+ Tambah Kategori";
        });

        form.addEventListener("reset", function() {
            indeksEdit = -1;
            tombolSimpan.textContent = "+ Tambah Kategori";
            pesan.textContent = "";
        });

        tampilkanKategori();
    </script>
</body>
</html>
