<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Barang - InventarisKu</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/theme.css">

    <style>
        .form-barang {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 20px 0;
        }
        .form-barang label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-barang input,
        .form-barang select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d9e6;
            border-radius: 7px;
            box-sizing: border-box;
        }
        .form-barang .button {
            border: 0;
            cursor: pointer;
            margin-right: 5px;
        }
        .pesan {
            margin: 12px 0;
            color: #176b3a;
        }
        .aksi {
            white-space: nowrap;
        }
        .hapus {
            background: #dc3545 !important;
            color: white !important;
            border: 0;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .form-barang { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>⬡ InventarisKu</h2>
        <nav>
            <a href="dashboard.html">⌂ Dashboard</a>
            <a href="kategori.html">▤ Kategori Barang</a>
            <a href="barang.html" class="active">▣ Data Barang</a>
            <a href="peminjaman.html">◷ Peminjaman</a>
            <a href="pengguna.html">♙ Pengguna</a>
            <a href="login.html" class="logout">⇥ Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button type="button" id="menuToggle">☰</button>
            <span>Admin</span>
        </header>

        <section class="content">
            <div class="welcome">
                <h1>Data Barang</h1>
                <p>Tambah, cari, dan hapus data inventaris barang.</p>
                <p id="tanggalWaktu"></p>
            </div>

            <section class="panel">
                <h2>Form Tambah Barang</h2>
                <form id="formBarang" class="form-barang">
                    <div>
                        <label for="kode">Kode Barang</label>
                        <input id="kode" required placeholder="Contoh: BRG006">
                    </div>
                    <div>
                        <label for="nama">Nama Barang</label>
                        <input id="nama" required placeholder="Masukkan nama barang">
                    </div>
                    <div>
                        <label for="kategori">Kategori</label>
                        <select id="kategori" required>
                            <option value="">Pilih kategori</option>
                            <option>Elektronik</option>
                            <option>Furniture</option>
                            <option>Aksesoris</option>
                            <option>Alat Tulis</option>
                            <option>Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label for="jumlah">Jumlah</label>
                        <input id="jumlah" type="number" min="1" required placeholder="Masukkan jumlah">
                    </div>
                    <div>
                        <label for="kondisi">Kondisi</label>
                        <select id="kondisi" required>
                            <option value="">Pilih kondisi</option>
                            <option>Baik</option>
                            <option>Rusak Ringan</option>
                            <option>Rusak Berat</option>
                        </select>
                    </div>
                    <div style="align-self:end">
                        <button class="button" type="submit">+ Simpan Barang</button>
                        <button class="button" type="reset">Kosongkan</button>
                    </div>
                </form>
                <p id="pesan" class="pesan" role="status"></p>
            </section>

            <section class="panel">
                <h2>Daftar Inventaris</h2>
                <p id="totalBarang">Total barang: 0 jenis</p>
                <div style="overflow-x:auto">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Kode</th>
                                <th>Nama Barang</th>
                                <th>Kategori</th>
                                <th>Jumlah</th>
                                <th>Kondisi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="daftarBarang"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>

<script src="../assets/js/script.js"></script>
<script>
const dataAwal = [
    {kode:"BRG001", nama:"Laptop Lenovo", kategori:"Elektronik", jumlah:10, kondisi:"Baik"},
    {kode:"BRG002", nama:"Proyektor Epson", kategori:"Elektronik", jumlah:5, kondisi:"Baik"},
    {kode:"BRG003", nama:"Kursi Kantor", kategori:"Furniture", jumlah:20, kondisi:"Baik"},
    {kode:"BRG004", nama:"Keyboard", kategori:"Aksesoris", jumlah:15, kondisi:"Baik"},
    {kode:"BRG005", nama:"Mouse Wireless", kategori:"Aksesoris", jumlah:12, kondisi:"Baik"}
];

let barang = JSON.parse(localStorage.getItem("inventarisku_barang") || "null");
if (!Array.isArray(barang)) {
    barang = dataAwal;
    simpanData();
}

function simpanData() {
    localStorage.setItem("inventarisku_barang", JSON.stringify(barang));
}

function buatSel(teks) {
    const td = document.createElement("td");
    td.textContent = teks;
    return td;
}

function tampilkanBarang() {
    const tabel = document.getElementById("daftarBarang");
    tabel.replaceChildren();

    barang.forEach((item, index) => {
        const baris = document.createElement("tr");
        baris.appendChild(buatSel(index + 1));
        baris.appendChild(buatSel(item.kode));
        baris.appendChild(buatSel(item.nama));
        baris.appendChild(buatSel(item.kategori));
        baris.appendChild(buatSel(item.jumlah));
        baris.appendChild(buatSel(item.kondisi));

        const aksi = document.createElement("td");
        aksi.className = "aksi";

        // Tombol Edit Barang
    const tombolEdit = document.createElement("button");
    tombolEdit.textContent = "Edit";
    tombolEdit.className = "button";
    tombolEdit.type = "button";

    tombolEdit.onclick = () => {
    kodeSedangDiedit = item.kode;

    document.getElementById("kode").value = item.kode;
    document.getElementById("nama").value = item.nama;
    document.getElementById("kategori").value = item.kategori;
    document.getElementById("jumlah").value = item.jumlah;
    document.getElementById("kondisi").value = item.kondisi;

    document.getElementById("kode").readOnly = true;

    document.querySelector("#formBarang button[type='submit']")
        .textContent = "Simpan Perubahan";

    document.getElementById("pesan").textContent =
        "Silakan ubah data, lalu klik Simpan Perubahan.";

    document.getElementById("formBarang").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
    };
        
        const tombolKurang = document.createElement("button");
        tombolKurang.textContent = "− 1";
        tombolKurang.className = "button";
        tombolKurang.type = "button";
        tombolKurang.title = "Kurangi jumlah satu";
        tombolKurang.onclick = () => {
            if (barang[index].jumlah > 1) {
                barang[index].jumlah--;
                simpanData();
                tampilkanBarang();
                document.getElementById("pesan").textContent =
                    "Jumlah barang berhasil dikurangi satu.";
            } else {
                alert("Jumlah sudah 1. Gunakan Hapus jika ingin menghapus jenis barang.");
            }
        };

        const tombolHapus = document.createElement("button");
        tombolHapus.textContent = "Hapus";
        tombolHapus.className = "hapus";
        tombolHapus.type = "button";
        tombolHapus.onclick = () => {
            if (confirm("Yakin ingin menghapus " + barang[index].nama + "?")) {
                barang.splice(index, 1);
                simpanData();
                tampilkanBarang();
                document.getElementById("pesan").textContent =
                    "Data barang berhasil dihapus.";
            }
            
     };
    aksi.append(
    tombolEdit,
     document.createTextNode(" "),
    tombolKurang,
    document.createTextNode(" "),
    tombolHapus
    );
        
        baris.appendChild(aksi);
        tabel.appendChild(baris);
    });

    document.getElementById("totalBarang").textContent =
        "Total barang: " + barang.length + " jenis";
}

let kodeSedangDiedit = null;

document.getElementById("formBarang").addEventListener("submit", function(event) {
    event.preventDefault();

    const kode = document.getElementById("kode").value.trim();
    const nama = document.getElementById("nama").value.trim();
    const kategori = document.getElementById("kategori").value;
    const jumlah = Number(document.getElementById("jumlah").value);
    const kondisi = document.getElementById("kondisi").value;
    const pesan = document.getElementById("pesan");

    if (!kode || !nama || !kategori || !kondisi ||
        !Number.isInteger(jumlah) || jumlah < 1) {
        pesan.textContent = "Periksa kembali semua isian.";
        return;
    }

    if (kodeSedangDiedit !== null) {
        const index = barang.findIndex(
            item => item.kode === kodeSedangDiedit
        );

        if (index !== -1) {
            barang[index] = {kode, nama, kategori, jumlah, kondisi};
        }

        simpanData();
        kodeSedangDiedit = null;
        document.getElementById("formBarang").reset();
        document.getElementById("kode").readOnly = false;
        document.querySelector("#formBarang button[type='submit']")
            .textContent = "+ Simpan Barang";
        tampilkanBarang();
        pesan.textContent = "Perubahan barang berhasil disimpan!";
        return;
    }

    if (barang.some(item => item.kode.toLowerCase() === kode.toLowerCase())) {
        pesan.textContent = "Kode barang sudah digunakan.";
        return;
    }

    barang.push({kode, nama, kategori, jumlah, kondisi});
    simpanData();
    tampilkanBarang();
    this.reset();
    pesan.textContent = "Barang berhasil ditambahkan!";
});

function editBarang(item) {
    kodeSedangDiedit = item.kode;
    document.getElementById("kode").value = item.kode;
    document.getElementById("nama").value = item.nama;
    document.getElementById("kategori").value = item.kategori;
    document.getElementById("jumlah").value = item.jumlah;
    document.getElementById("kondisi").value = item.kondisi;
    document.getElementById("kode").readOnly = true;
    document.querySelector("#formBarang button[type='submit']")
        .textContent = "Simpan Perubahan";
    document.getElementById("pesan").textContent =
        "Ubah data, lalu klik Simpan Perubahan.";
    document.getElementById("formBarang").scrollIntoView({
        behavior: "smooth"
    });
}

tampilkanBarang();
</script>
</body>
</html>
